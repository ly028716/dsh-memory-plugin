name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Coverage regression
        run: npm run test:coverage -- --runInBand

      - name: Syntax checks
        run: npm run check

      - name: DSH integration test
        run: npm run test:integration

      - name: Installation test
        run: npm run test:install

      - name: Quick test
        run: npm run test:quick

      - name: Package verification
        run: npm run test:package

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Real browser E2E
        run: npm run test:browser-e2e

      - name: Upload browser E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ matrix.node-version }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Pinned commit installation
        run: npm run test:pinned-commit

      - name: DSH clean-profile E2E
        run: npm run test:dsh-e2e

      - name: Package dry run
        run: npm pack --dry-run

      - name: Dependency audit
        run: npm audit --audit-level=high
