name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 20
            playwright_args: --with-deps
          - os: ubuntu-latest
            node-version: 22
            playwright_args: --with-deps
          - os: windows-latest
            node-version: 20
            playwright_args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install DSH CLI for real integration E2E
        run: npm install --global @deepseek-ai/dsh@0.1.1-rc.2 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Unit tests
        run: npm test -- --runInBand

      - name: Coverage regression
        run: npm run test:coverage -- --runInBand

      - name: Syntax checks
        run: npm run check

      - name: DSH integration test
        run: npm run test:integration

      - name: Installation test
        run: npm run test:install

      - name: Quick test
        run: npm run test:quick

      - name: Package verification
        run: npm run test:package

      - name: Install Chromium for browser E2E
        run: npx playwright install ${{ matrix.playwright_args }} chromium

      - name: Real browser E2E
        run: npm run test:browser-e2e

      - name: Upload browser E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-e2e-${{ matrix.node-version }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Pinned commit installation
        run: npm run test:pinned-commit

      - name: DSH clean-profile E2E
        env:
          DSH_E2E_REQUIRED: 1
        run: npm run test:dsh-e2e

      - name: Package dry run
        run: npm pack --dry-run

      - name: Dependency audit
        run: npm run test:audit
