name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      release_version: ${{ steps.package.outputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install DSH CLI for real integration E2E
        run: npm install --global @deepseek-ai/dsh@0.1.1-rc.2 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Verify source and package
        env:
          DSH_E2E_REQUIRED: 1
        run: |
          npm run check
          npm test -- --runInBand
          npm run test:package
          npm run test:pinned-commit
          npm run test:dsh-e2e

      - name: Real browser E2E
        run: npm run test:browser-e2e

      - name: Upload browser E2E report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-e2e-release
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Build release artifact
        id: package
        run: |
          mkdir -p dist
          release_version="${GITHUB_REF_NAME#v}"
          node - "$release_version" <<'NODE'
          const releaseVersion = process.argv[2];
          const semverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/;
          if (!semverPattern.test(releaseVersion)) {
            console.error(`Invalid release tag version: ${releaseVersion}`);
            process.exit(1);
          }
          NODE
          npm pack --json --pack-destination dist > dist/pack-result.json
          artifact_name="$(node - "$release_version" <<'NODE'
          const fs = require('fs');
          const releaseVersion = process.argv[2];
          const result = JSON.parse(fs.readFileSync('dist/pack-result.json', 'utf8'));
          if (!Array.isArray(result) || result.length !== 1) {
            throw new Error('npm pack must return exactly one package');
          }
          const pack = result[0];
          const artifactName = result[0].filename;
          if (!pack || typeof artifactName !== 'string' || artifactName.length === 0) {
            throw new Error('npm pack did not return a filename');
          }
          if (pack.version !== releaseVersion) {
            throw new Error(`Packed version ${pack.version} does not match tag version ${releaseVersion}`);
          }
          console.log(artifactName);
          NODE
          )"
          test -n "$artifact_name"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dsh-memory-plugin-${{ github.ref_name }}
          path: dist/${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dsh-memory-plugin-${{ github.ref_name }}
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "@ly028716/dsh-memory-plugin@${{ needs.verify.outputs.release_version }}" version --registry https://registry.npmjs.org > /dev/null 2>&1; then
            echo "Skipping npm publish: version ${{ needs.verify.outputs.release_version }} already exists"
          else
            npm publish "dist/${{ needs.verify.outputs.artifact_name }}" --access public --provenance
          fi

  create-draft-release:
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dsh-memory-plugin-${{ github.ref_name }}
          path: dist

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if is_draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to overwrite published release $GITHUB_REF_NAME" >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "dist/${{ needs.verify.outputs.artifact_name }}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/${{ needs.verify.outputs.artifact_name }}" --repo "$GITHUB_REPOSITORY" --draft --generate-notes
          fi

  verify-release-install:
    needs: [verify, create-draft-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Download GitHub Release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "${{ needs.verify.outputs.artifact_name }}" --dir "$RUNNER_TEMP/release-artifact"

      - name: Verify published npm and GitHub artifact installations
        run: |
          release_version="${{ needs.verify.outputs.release_version }}"
          github_tarball="$RUNNER_TEMP/release-artifact/${{ needs.verify.outputs.artifact_name }}"
          test -n "$github_tarball"
          test -f "$github_tarball"
          npm run test:release-install -- --version "$release_version" --github-tarball "$github_tarball"

  publish-release:
    needs: verify-release-install
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
