name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Verify source and package
        run: |
          npm run check
          npm test -- --runInBand
          npm run test:package
          npm run test:pinned-commit
          npm run test:dsh-e2e

      - name: Real browser E2E
        run: npm run test:browser-e2e

      - name: Upload browser E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-release
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Build release artifact
        id: package
        run: |
          mkdir -p dist
          npm pack --json --pack-destination dist > dist/pack-result.json
          artifact_name="$(node -e "const fs = require('fs'); const result = JSON.parse(fs.readFileSync('dist/pack-result.json', 'utf8')); const artifactName = result[0].filename; if (!artifactName) throw new Error('npm pack did not return a filename'); console.log(artifactName);")"
          test -n "$artifact_name"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-memory-plugin-${{ github.ref_name }}
          path: dist/${{ steps.package.outputs.artifact_name }}
          if-no-files-found: error

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-memory-plugin-${{ github.ref_name }}
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "dist/${{ needs.verify.outputs.artifact_name }}" --access public --provenance

  create-draft-release:
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-memory-plugin-${{ github.ref_name }}
          path: dist

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "dist/${{ needs.verify.outputs.artifact_name }}" --repo "$GITHUB_REPOSITORY" --draft --generate-notes

  verify-release-install:
    needs: [verify, create-draft-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Download GitHub Release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "${{ needs.verify.outputs.artifact_name }}" --dir "$RUNNER_TEMP/release-artifact"

      - name: Verify published npm and GitHub artifact installations
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          github_tarball="$RUNNER_TEMP/release-artifact/${{ needs.verify.outputs.artifact_name }}"
          test -n "$github_tarball"
          test -f "$github_tarball"
          npm run test:release-install -- --version "$release_version" --github-tarball "$github_tarball"

  publish-release:
    needs: verify-release-install
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
