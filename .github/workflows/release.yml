name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Verify source and package
        run: |
          npm run check
          npm test -- --runInBand
          npm run test:package
          npm run test:pinned-commit
          npm run test:dsh-e2e

      - name: Real browser E2E
        run: npm run test:browser-e2e

      - name: Upload browser E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-release
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Build release artifact
        run: npm pack --pack-destination dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-memory-plugin-${{ github.ref_name }}
          path: dist/*.tgz
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tgz

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/*.tgz --access public --provenance

      - name: Download GitHub Release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-artifact"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "*.tgz" --dir "$RUNNER_TEMP/release-artifact"

      - name: Verify published npm and GitHub artifact installations
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          github_tarball="$(find "$RUNNER_TEMP/release-artifact" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$github_tarball"
          npm run test:release-install -- --version "$release_version" --github-tarball "$github_tarball"
